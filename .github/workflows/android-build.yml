name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'contador_objetivos_android.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -q contador_objetivos_android.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: contador_objetivos
        run: gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: contador-objetivos-apk
          path: contador_objetivos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
